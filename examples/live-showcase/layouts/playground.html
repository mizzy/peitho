<section class="playground">
  <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
  <div class="panes">
    <div class="editor" spellcheck="false" aria-label="Code"><slot name="code" accepts="code" arity="1"></slot></div>
    <div class="side">
      <button class="run" type="button">Run ▶</button>
      <pre class="output" aria-live="polite"></pre>
    </div>
  </div>
  <script>
    if (!window.showcasePlaygroundInstalled) {
      window.showcasePlaygroundInstalled = true;
      const mount = ({ root }) => {
        const editor = root.querySelector(".playground .editor");
        if (!editor || editor.dataset.mounted) return;
        editor.dataset.mounted = "true";
        editor.contentEditable = "plaintext-only";
        const output = root.querySelector(".playground .output");
        root.querySelector(".playground .run").addEventListener("click", () => {
          const lines = [];
          const log = (...args) => lines.push(args.map(String).join(" "));
          try {
            new Function("console", editor.textContent)({ log });
          } catch (error) {
            lines.push(`${error.name}: ${error.message}`);
          }
          output.textContent = lines.join("\n");
        });
      };
      window.__peithoShadowRoots.forEach(mount);
      document.addEventListener("peitho:shadow-mounted", (event) => mount(event.detail));
    }
  </script>
</section>
