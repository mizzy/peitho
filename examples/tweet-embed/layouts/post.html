<section class="tweet-embed tweet-embed-post">
  <div class="tweet-copy">
    <p class="eyebrow">Official X embed</p>
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
    <div class="body-copy">
      <slot name="body" accepts="blocks" arity="1"></slot>
    </div>
  </div>
  <figure class="tweet-frame">
    <slot name="image" accepts="image" arity="1"></slot>
  </figure>
</section>
