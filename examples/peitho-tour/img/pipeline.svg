  <text x="945" y="152" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" fill="#dce4f2">dist/</text>
  <text x="520" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#95a4be">Slot contracts are checked before anything renders: a broken deck never reaches dist/.</text>
