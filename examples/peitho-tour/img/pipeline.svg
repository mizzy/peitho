  <text x="265" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#dce4f2">Parsed</text>
  <line x1="337" y1="144" x2="361" y2="144" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
