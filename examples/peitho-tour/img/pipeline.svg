  <rect x="707" y="108" width="136" height="72" rx="12" fill="#17233e" stroke="url(#accent)" stroke-width="2"/>
  <text x="775" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#dce4f2">Rendered</text>
