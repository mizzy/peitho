  <rect width="1040" height="300" rx="18" fill="#0f1730"/>
  <text x="520" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#f2f6fd">Every deck takes the same typed path</text>
